name: Deploy AWS Resources to Analyze Images once Merged

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy_and_process:
    runs-on: ubuntu-latest
    env:
      DEPLOY_RESOURCES: true

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Create S3 Bucket For Lambda Functions
        if: env.DEPLOY_RESOURCES == 'true'
        run: |
          echo "Beginning S3 Bucket creations..."
          create_output=$(aws s3 mb s3://${{ secrets.S3_LAMBDA_BUCKET }})
          echo "S3 Bucket creation output: $create_output"
          echo "The S3 Bucket has been created successfully"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Package Lambda Functions
        if: env.DEPLOY_RESOURCES == 'true'
        run: |
          echo "Packaging Lambda Functions..."
          cd lambda
          zip beta.zip beta.py
          zip prod.zip prod.py
          echo "Lambda functions have been successfully packaged"

      - name: Deploy CloudFormation Stack
        if: env.DEPLOY_RESOURCES == 'true'
        id: deploy_stack
        run: |
          echo "Beginning requested Cloud Formation stack deployment..."
          deploy_output=$(aws cloudformation deploy \
            --template-file cloudformation/template.yml \
            --stack-name AcmeLabsImageAnalyzerStack \
            --parameter-overrides \
            AccountId=${{ secrets.AWS_ACCOUNT_ID }}
            S3LambdaBucket=${{ secrets.S3_LAMBDA_BUCKET }}
            S3ImageAnalyzerBucket=${{ secrets.S3_ANALYZE_BUCKET }}
            BetaDynamoDBTableName=${{ secrets.BETA_DYNAMODB_TABLE }}
            ProdDynamoDBTableName=${{ secrets.PROD_DYNAMODB_TABLE }}
            --capabilities CAPABILITY_NAMED_IAM)
          echo "CloudFormation deployment output: $deploy_output"
          echo "CloudFormation stack has been successfully deploayed."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Update S3 Bucket Notification Configuration
        if: steps.deploy_stack.outcome == 'success' && env.DEPLOY_RESOURCES == 'true'
        run: |
          echo "Updating S3 bucket notification configuration to trigger Lambda functions..."
          notification_output=$(aws s3api put-bucket-notification-configartion \
            --bucket ${{ secrets.S3_ANALYZE_BUCKET }} \
            --notification-configuration '{
            "LambdaFunctionArn": "arn:aws:lambda:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:function:${{ secrets.BETA_LAMBDA_FUNCTION }}",
            "Events": ["s3:ObjectCreated:*"]
            "Filter": {
              "Key": {
                  "FilterRules": [
                      {
                      "Name": "prefix",
                      "Value": "rekognition-input/beta/"
                      }
                  ]
              }
          }

          }',
          {
            "LambdaFunctionArn": "arn:aws:lambda:${{ secrets.AWS_REGION }}:function:${{ secrets.AWS_ACCOUNT_ID }}:function:${{ secrets.PROD_LAMBDA_FUNCTION }}",
            "Events": ["s3:ObjectedCreated:*"],
            "Filter": {
              "Key": {
                  "FilterRules": [
                      {
                      "Name": "prefix",
                      "Value": "rekognition-input/prod/"
                      }
                  ]
              }
          }
          }')
          echo "S3 bucket notification configuration output: $notification_output"
          echo "S3 bucket notification configuration has been successfully updated."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Upload Images to S3
        if: env.DEPLOY_RESOURCES == 'false'
        run: |
          echo "Checking images to upload..."
          if [ -d images ] && [ "$(find images -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' -o -name '*.bmp' -o -name '*.tiff' -o -name '*.tif' -o -name '*.webp' \))" ]; then
            echo "Uploading images to the S3 bucket for processing..."
            upload_images_output=$(aws s3 cp images/ s3://${{ secrets.S3_ANALYZE_BUCKET }}/rekognition-input/prod/ --recursive)
            echo "Image upload output: $upload_images_output"
            echo "Images uploaded successfully."
          else
            echo "No supported images found in the directory. Skipping upload."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}