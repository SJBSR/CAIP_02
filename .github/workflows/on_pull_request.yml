name: Analyze Images on Pull Request

on:
    pull_request:
        branches:
            - main

jobs:
    upload:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Validate required secrets
              run: |
                missing=0 for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ANALYZE_BUCKET; 
                do if [ run: echo "$V" # shell uses $V ]; 
                then echo "Missing secret: $v" missing=1 
                fi done 
                if [ $missing -eq 1 ]; 
                then echo "Required secrets are not set. Exiting." exit 1 
                fi
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2 
              with: 
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Upload Images to S3
              run: |
                echo "Beginning images upload to S3 bucket."
                if [ -d images ] && [ -n "$(find images -type f \( -name '*.jpg' -o -name '*.png' -o -name '*.gif' -o -name '*.webp' \))" ]; then
                  upload_output=$(aws s3 cp images/ s3://${{ secrets.S3_ANALYZE_BUCKET }}/rekognition-input/beta --recursive)
                  echo "Upload output: $upload_output"
                  echo "The images have been successfully uploaded to S3."
                else
                  echo "No supported images found in the directory. Skipping upload."
                fi
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} 
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
                AWS_REGION: ${{ secrets.AWS_REGION }}